server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    location = /accommodation {
        return 301 /accommodation/;
    }

    location /accommodation/ {
        set $student1_frontend http://student1-frontend;
        rewrite ^/accommodation/(.*)$ /$1 break;
        proxy_pass $student1_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /itinerary {
        return 301 /itinerary/;
    }

    location /itinerary/ {
        set $student2_frontend http://student2-frontend;
        rewrite ^/itinerary/(.*)$ /$1 break;
        proxy_pass $student2_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /itinerary-api/ {
        set $student2_backend http://student2-backend:8080;
        rewrite ^/itinerary-api/(.*)$ /api/$1 break;
        proxy_pass $student2_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $request_id;
    }

    location = /attractions {
        return 301 /attractions/;
    }

    location /attractions/ {
        set $student3_frontend http://student3-frontend;
        rewrite ^/attractions/(.*)$ /$1 break;
        proxy_pass $student3_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /attractions-api/ {
        set $student3_backend http://student3-backend:8080;
        rewrite ^/attractions-api/(.*)$ /api/$1 break;
        proxy_pass $student3_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /attractions-api/recommend can call Ollama twice (see
        # student-3/frontend/nginx.conf), so this needs the same generous
        # timeouts rather than nginx's 60s default.
        proxy_read_timeout 250s;
        proxy_send_timeout 250s;
    }

    location = /budget {
        return 301 /budget/;
    }

    location /budget/ {
        set $student4_frontend http://student4-frontend;
        rewrite ^/budget/(.*)$ /$1 break;
        proxy_pass $student4_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /budget-api/ {
        set $student4_backend http://student4-backend:8080;
        rewrite ^/budget-api/(.*)$ /api/$1 break;
        proxy_pass $student4_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $request_id;
    }

    location = /logistics {
        return 301 /logistics/;
    }

    location /logistics/ {
        set $student5_frontend http://student5-frontend;
        rewrite ^/logistics/(.*)$ /$1 break;
        proxy_pass $student5_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ui/ {
        set $student5_frontend_ui http://student5-frontend;
        proxy_pass $student5_frontend_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Student 5's page links its stylesheet with an absolute path
    # (href="/style.css"), so under /logistics/ the browser requests it from
    # the gateway origin's root rather than from student5-frontend. Without
    # this, that request falls through to the SPA catch-all below and gets
    # this app's index.html back instead of CSS, leaving the page unstyled.
    # student-5/frontend is off-limits to edit, so this shims the one path
    # its markup asks for.
    location = /style.css {
        set $student5_frontend_style http://student5-frontend;
        proxy_pass $student5_frontend_style;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        set $student1_assets http://student1-frontend;
        proxy_pass $student1_assets;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $student1_backend http://student1-backend:8080;
        proxy_pass $student1_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /shared/ {
        alias /usr/share/nginx/html/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
