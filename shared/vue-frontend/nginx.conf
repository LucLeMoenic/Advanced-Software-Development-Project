server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    location = /accommodation {
        return 301 /accommodation/;
    }

    location /accommodation/ {
        set $student1_frontend http://student1-frontend;
        rewrite ^/accommodation/(.*)$ /$1 break;
        proxy_pass $student1_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /itinerary {
        return 301 /itinerary/;
    }

    location /itinerary/ {
        set $student2_frontend http://student2-frontend;
        rewrite ^/itinerary/(.*)$ /$1 break;
        proxy_pass $student2_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /itinerary-api/ {
        set $student2_backend http://student2-backend:8080;
        rewrite ^/itinerary-api/(.*)$ /api/$1 break;
        proxy_pass $student2_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $request_id;
    }

    location = /budget {
        return 301 /budget/;
    }

    location /budget/ {
        set $student4_frontend http://student4-frontend;
        rewrite ^/budget/(.*)$ /$1 break;
        proxy_pass $student4_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /budget-api/ {
        set $student4_backend http://student4-backend:8080;
        rewrite ^/budget-api/(.*)$ /api/$1 break;
        proxy_pass $student4_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $request_id;
    }

    location /assets/ {
        set $student1_assets http://student1-frontend;
        proxy_pass $student1_assets;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $student1_backend http://student1-backend:8080;
        proxy_pass $student1_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /shared/ {
        alias /usr/share/nginx/html/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
