services:
  shared-frontend:
    build:
      context: ./shared/vue-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5100:80"
    depends_on:
      student1-frontend:
        condition: service_healthy
      student2-frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student1-frontend:
    build:
      context: ./student-1/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5101:80"
    depends_on:
      student1-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student1-backend:
    build:
      context: ./student-1/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      Services__DatabaseUrl: http://student1-database:8080
      Services__OllamaUrl: http://ollama:11434
      Services__LiteApiUrl: https://api.liteapi.travel
      LITEAPI_KEY: ${LITEAPI_KEY:-}
      APPLICATION_MODEL: ${APPLICATION_MODEL:-llama3.2:3b}
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5201:8080"
    depends_on:
      student1-database:
        condition: service_healthy
      ollama-model-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student1-database:
    build:
      context: ./student-1/database
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__AccommodationDatabase: Data Source=/data/accommodation.db
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5301:8080"
    volumes:
      - ./student-1/database/storage:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student2-frontend:
    build:
      context: ./student-2/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5102:80"
    depends_on:
      student2-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student2-backend:
    build:
      context: ./student-2/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: http://student2-database:8080
      OLLAMA_URL: http://ollama:11434
      APPLICATION_MODEL: ${APPLICATION_MODEL:-llama3.2:3b}
      PORT: 8080
    ports:
      - "5202:8080"
    depends_on:
      student2-database:
        condition: service_healthy
      ollama-model-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  student2-database:
    build:
      context: ./student-2/database
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/itinerary.db
      PORT: 8080
    ports:
      - "5302:8080"
    volumes:
      - ./student-2/database/storage:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  student3-frontend:
    build:
      context: ./student-3/frontend
      dockerfile: Dockerfile
    ports:
      - "5103:80"

  student4-frontend:
    build:
      context: ./student-4/frontend
      dockerfile: Dockerfile
    ports:
      - "5104:80"

  student5-frontend:
    build:
      context: ./student-5/frontend
      dockerfile: Dockerfile
    ports:
      - "5105:80"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-model-setup:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODELS: ${OLLAMA_MODELS:-llama3.2:3b qwen2.5-coder:7b}
      APPLICATION_MODEL: ${APPLICATION_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for model in $$OLLAMA_MODELS $$APPLICATION_MODEL; do
          if ollama show "$$model" > /dev/null 2>&1; then
            echo "Ollama model already installed: $$model"
          else
            ollama pull "$$model"
          fi
        done
        echo "Preloading application model: $$APPLICATION_MODEL"
        ollama run "$$APPLICATION_MODEL" "Return only OK." --keepalive 30m > /dev/null
    depends_on:
      ollama:
        condition: service_healthy

  agentic-loop:
    build:
      context: ./ai-services/agentic-loop
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      IMPLEMENTER_MODEL: ${IMPLEMENTER_MODEL:-qwen2.5-coder:7b}
      REVIEWER_MODEL: ${REVIEWER_MODEL:-llama3.2:3b}
      ASPNETCORE_URLS: http://+:8080
      AGENTIC_LOOP_HEALTH_URL: http://localhost:8080/health
    ports:
      - "5180:8080"
    volumes:
      - ./:/workspace:ro
      - ./docs/agentic-loop-records:/workspace/docs/agentic-loop-records
    depends_on:
      ollama-model-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dotnet", "/app/AgenticLoop.dll", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  ollama-data:
