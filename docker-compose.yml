services:
  shared-frontend:
    build:
      context: ./shared/vue-frontend
      dockerfile: Dockerfile
    ports:
      - "5100:80"
    depends_on:
      - ollama

  student2-frontend:
    build:
      context: ./student-2/frontend
      dockerfile: Dockerfile
    ports:
      - "5102:80"

  student3-frontend:
    build:
      context: ./student-3/frontend
      dockerfile: Dockerfile
    ports:
      - "5103:80"

  student4-frontend:
    build:
      context: ./student-4/frontend
      dockerfile: Dockerfile
    ports:
      - "5104:80"

  student5-frontend:
    build:
      context: ./student-5/frontend
      dockerfile: Dockerfile
    ports:
      - "5105:80"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
