services:
  shared-frontend:
    build:
      context: ./shared/vue-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5100:80"
    depends_on:
      student1-frontend:
        condition: service_healthy
      student2-frontend:
        condition: service_healthy
      student3-frontend:
        condition: service_healthy
      student4-frontend:
        condition: service_healthy
      student5-frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student1-frontend:
    build:
      context: ./student-1/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5101:80"
    depends_on:
      student1-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student1-backend:
    build:
      context: ./student-1/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      Services__DatabaseUrl: http://student1-database:8080
      Services__OllamaUrl: http://host.docker.internal:11434
      MCP_ENABLED: ${MCP_ENABLED:-false}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      MCP_SERVER_URL: http://host.docker.internal:5400/mcp
      RAG_SERVER_URL: http://host.docker.internal:5500
      Services__LiteApiUrl: https://api.liteapi.travel
      LITEAPI_KEY: ${LITEAPI_KEY:-}
      APPLICATION_MODEL: ${APPLICATION_MODEL:-llama3.2:3b}
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5201:8080"
    extra_hosts:
      - "host.docker.internal:${LOCAL_AI_HOST:-host-gateway}"
    depends_on:
      student1-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student1-database:
    build:
      context: ./student-1/database
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__AccommodationDatabase: Data Source=/data/accommodation.db
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5301:8080"
    volumes:
      - ./student-1/database/storage:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student2-frontend:
    build:
      context: ./student-2/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5102:80"
    depends_on:
      student2-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student2-backend:
    build:
      context: ./student-2/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: http://student2-database:8080
      OLLAMA_URL: http://host.docker.internal:11434
      AI_ENABLED: ${AI_ENABLED:-true}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://host.docker.internal:5400/mcp}
      RAG_SERVER_URL: ${RAG_SERVER_URL:-http://host.docker.internal:5500}
      APPLICATION_MODEL: ${APPLICATION_MODEL:-llama3.2:3b}
      PORT: 8080
    ports:
      - "5202:8080"
    extra_hosts:
      - "host.docker.internal:${LOCAL_AI_HOST:-host-gateway}"
    depends_on:
      student2-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  student2-database:
    build:
      context: ./student-2/database
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/itinerary.db
      PORT: 8080
    ports:
      - "5302:8080"
    volumes:
      - ./student-2/database/storage:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  student3-frontend:
    build:
      context: ./student-3/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5103:80"
    depends_on:
      student3-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student3-backend:
    build:
      context: ./student-3/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_API_URL: http://student3-database:8080
      OLLAMA_URL: http://host.docker.internal:11434
      MCP_SERVER_URL: http://host.docker.internal:5400/mcp
      RAG_SERVER_URL: http://host.docker.internal:5500
      OLLAMA_MODEL: ${STUDENT3_MODEL:-qwen2.5:3b}
    ports:
      - "5203:8080"
    extra_hosts:
      - "host.docker.internal:${LOCAL_AI_HOST:-host-gateway}"
    depends_on:
      student3-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  student3-db-init:
    build:
      context: ./student-3/database
      dockerfile: Dockerfile
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        python init_db.py
        python seed.py
    environment:
      DATABASE_PATH: /data/attractions.db
    volumes:
      - ./student-3/database/storage:/data

  student3-database:
    build:
      context: ./student-3/database
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/attractions.db
    ports:
      - "5303:8080"
    volumes:
      - ./student-3/database/storage:/data
    depends_on:
      student3-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  student4-frontend:
    build:
      context: ./student-4/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5104:80"
    depends_on:
      student4-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student4-backend:
    build:
      context: ./student-4/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      Services__DatabaseUrl: http://student4-database:8080
      Services__OllamaUrl: http://host.docker.internal:11434
      MCP_SERVER_URL: http://host.docker.internal:5400/mcp
      RAG_SERVER_URL: http://host.docker.internal:5500
      STUDENT4_MODEL: ${STUDENT4_MODEL:-llama3.2:3b}
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5204:8080"
    extra_hosts:
      - "host.docker.internal:${LOCAL_AI_HOST:-host-gateway}"
    depends_on:
      student4-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student4-database:
    build:
      context: ./student-4/database
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__BudgetDatabase: Data Source=/data/budget.db
      DemoData__Seed: true
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5304:8080"
    volumes:
      - ./student-4/database/storage:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student5-frontend:
    build:
      context: ./student-5/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5105:80"
    depends_on:
      student5-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student5-backend:
    build:
      context: ./student-5/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_API_URL: http://student5-database:8080
      OLLAMA_URL: http://host.docker.internal:11434
      MCP_SERVER_URL: http://host.docker.internal:5400/mcp
      RAG_SERVER_URL: http://host.docker.internal:5500
      APPLICATION_MODEL: ${APPLICATION_MODEL:-llama3.2:3b}
    ports:
      - "5205:8080"
    extra_hosts:
      - "host.docker.internal:${LOCAL_AI_HOST:-host-gateway}"
    depends_on:
      student5-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  student5-database:
    build:
      context: ./student-5/database
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/logistics.db
    ports:
      - "5305:8080"
    volumes:
      - ./student-5/database/storage:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
