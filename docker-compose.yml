services:
  shared-frontend:
    build:
      context: ./shared/vue-frontend
      dockerfile: Dockerfile
    ports:
      - "5100:80"
    depends_on:
      - ollama

  student1-frontend:
    build:
      context: ./student-1/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5101:80"
    depends_on:
      student1-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student1-backend:
    build:
      context: ./student-1/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      Services__DatabaseUrl: http://student1-database:8080
      Services__OllamaUrl: http://ollama:11434
      APPLICATION_MODEL: ${APPLICATION_MODEL:-llama3.2:3b}
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5201:8080"
    depends_on:
      student1-database:
        condition: service_healthy
      ollama-application-model:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student1-database:
    build:
      context: ./student-1/database
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__AccommodationDatabase: Data Source=/data/accommodation.db
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5301:8080"
    volumes:
      - ./student-1/database/storage:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student2-frontend:
    build:
      context: ./student-2/frontend
      dockerfile: Dockerfile
    ports:
      - "5102:80"

  student3-db-init:
    build:
      context: ./student-3/database
      dockerfile: Dockerfile
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        python init_db.py
        python seed.py
    environment:
      DATABASE_PATH: /data/attractions.db
    volumes:
      - ./student-3/database/storage:/data

  student3-database:
    build:
      context: ./student-3/database
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/attractions.db
    ports:
      - "5303:8080"
    volumes:
      - ./student-3/database/storage:/data
    depends_on:
      student3-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  student3-backend:
    build:
      context: ./student-3/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_API_URL: http://student3-database:8080
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${STUDENT3_MODEL:-qwen2.5:3b}
    ports:
      - "5203:8080"
    depends_on:
      student3-database:
        condition: service_healthy
      ollama-student3-model:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  student3-frontend:
    build:
      context: ./student-3/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5103:80"
    depends_on:
      student3-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  student4-frontend:
    build:
      context: ./student-4/frontend
      dockerfile: Dockerfile
    ports:
      - "5104:80"

  student5-frontend:
    build:
      context: ./student-5/frontend
      dockerfile: Dockerfile
    ports:
      - "5105:80"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-application-model:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${APPLICATION_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if ollama show "$$MODEL" > /dev/null 2>&1; then
          echo "Ollama model already installed: $$MODEL"
        else
          ollama pull "$$MODEL"
        fi
    depends_on:
      ollama:
        condition: service_healthy

  ollama-student3-model:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${STUDENT3_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if ollama show "$$MODEL" > /dev/null 2>&1; then
          echo "Ollama model already installed: $$MODEL"
        else
          ollama pull "$$MODEL"
        fi
    depends_on:
      ollama:
        condition: service_healthy

  ollama-agentic-models:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      IMPLEMENTER_MODEL: ${IMPLEMENTER_MODEL:-qwen2.5-coder:7b}
      REVIEWER_MODEL: ${REVIEWER_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for model in "$$IMPLEMENTER_MODEL" "$$REVIEWER_MODEL"; do
          if ollama show "$$model" > /dev/null 2>&1; then
            echo "Ollama model already installed: $$model"
          else
            ollama pull "$$model"
          fi
        done
    depends_on:
      ollama:
        condition: service_healthy

  agentic-loop:
    build:
      context: ./ai-services/agentic-loop
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      IMPLEMENTER_MODEL: ${IMPLEMENTER_MODEL:-qwen2.5-coder:7b}
      REVIEWER_MODEL: ${REVIEWER_MODEL:-llama3.2:3b}
      ASPNETCORE_URLS: http://+:8080
      AGENTIC_LOOP_HEALTH_URL: http://localhost:8080/health
    ports:
      - "5180:8080"
    volumes:
      - ./:/workspace:ro
      - ./docs/agentic-loop-records:/workspace/docs/agentic-loop-records
    depends_on:
      ollama-agentic-models:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dotnet", "/app/AgenticLoop.dll", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  ollama-data:
