name: Student 2 CI

permissions:
  contents: read

on:
  push:
    paths:
      - "student-2/**"
      - "shared/vue-frontend/**"
      - ".github/workflows/student-2.yml"
      - "docker-compose.yml"
  pull_request:
    paths:
      - "student-2/**"
      - "shared/vue-frontend/**"
      - ".github/workflows/student-2.yml"
      - "docker-compose.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: student-2/frontend/package-lock.json

      - name: Install frontend test dependencies
        working-directory: student-2/frontend
        run: npm ci

      - name: Test frontend behavior
        working-directory: student-2/frontend
        run: npm test

      - name: Install backend test dependencies
        run: pip install -r student-2/backend/requirements.txt pytest

      - name: Test backend orchestration
        working-directory: student-2/backend
        run: python -m pytest tests

      - name: Install database test dependencies
        run: pip install -r student-2/database/requirements.txt

      - name: Test database API
        working-directory: student-2/database
        run: python -m pytest tests

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Build integrated Student 2 containers
        run: docker compose build shared-frontend student2-frontend student2-backend student2-database

      - name: Start Student 2 services
        run: docker compose up --detach --no-deps --wait student2-database student2-backend student2-frontend

      - name: Smoke test Student 2 integration
        run: |
          curl --fail --silent http://localhost:5102/health
          curl --fail --silent http://localhost:5202/health
          curl --fail --silent http://localhost:5302/health
          curl --fail --silent http://localhost:5202/api/trips | python -c "import json,sys; trips=json.load(sys.stdin); assert len(trips) >= 10"

      - name: Stop Student 2 services
        if: always()
        run: docker compose down
