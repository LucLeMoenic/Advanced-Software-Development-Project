name: Student 1 CI

permissions:
  contents: read

on:
  push:
    paths:
      - "student-1/**"
      - "shared/vue-frontend/**"
      - "ai-services/agentic-loop/**"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/test/verify-agentic-models.ps1"
      - "scripts/test/student-1.ps1"
      - "scripts/test/junit_summary.py"
      - "scripts/deploy/smoke_cloud.py"
      - "scripts/test/test_cloud_smoke_student1.py"
      - ".github/workflows/student-1.yml"
      - "ai-services/mcp-server/requirements.txt"
      - "ai-services/mcp-server/tools/__init__.py"
      - "ai-services/mcp-server/tools/accommodation.py"
      - "ai-services/mcp-server/tests/test_accommodation_tools.py"
      - "ai-services/rag-server/requirements.txt"
      - "ai-services/rag-server/retrieval.py"
      - "ai-services/rag-server/confidence.py"
      - "ai-services/rag-server/knowledge/student-1/**"
      - "ai-services/rag-server/tests/test_retrieval.py"
      - "ai-services/rag-server/tests/test_student1_retrieval.py"
      - "ai-services/rag-server/tests/grounding-questions.json"
  pull_request:
    paths:
      - "student-1/**"
      - "shared/vue-frontend/**"
      - "ai-services/agentic-loop/**"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/test/verify-agentic-models.ps1"
      - "scripts/test/student-1.ps1"
      - "scripts/test/junit_summary.py"
      - "scripts/deploy/smoke_cloud.py"
      - "scripts/test/test_cloud_smoke_student1.py"
      - ".github/workflows/student-1.yml"
      - "ai-services/mcp-server/requirements.txt"
      - "ai-services/mcp-server/tools/__init__.py"
      - "ai-services/mcp-server/tools/accommodation.py"
      - "ai-services/mcp-server/tests/test_accommodation_tools.py"
      - "ai-services/rag-server/requirements.txt"
      - "ai-services/rag-server/retrieval.py"
      - "ai-services/rag-server/confidence.py"
      - "ai-services/rag-server/knowledge/student-1/**"
      - "ai-services/rag-server/tests/test_retrieval.py"
      - "ai-services/rag-server/tests/test_student1_retrieval.py"
      - "ai-services/rag-server/tests/grounding-questions.json"

jobs:
  accommodation-services:
    runs-on: ubuntu-latest
    # MCP and RAG integration is retained but disabled in CI; tests use fakes and make no live calls.
    env:
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: student-1/frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Student 1 feature
        run: pwsh -NoProfile -File scripts/test/student-1.ps1 -Area Feature
      # The shared pre-commit hooks scan Python only; these cover the C# and Vue dependencies.
      - name: Scan Student 1 .NET and npm dependencies
        run: pwsh -NoProfile -File scripts/test/student-1.ps1 -Area Security
      - name: Test Student 1 cloud smoke check
        run: python -m pytest scripts/test/test_cloud_smoke_student1.py -v
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build integrated Student 1 containers
        run: bash scripts/ci/retry-transient.sh 3 20 docker compose build shared-frontend student1-frontend student1-backend student1-database

      # Release 2 post-commit endpoint tests: POST and PATCH /api/searches against the
      # running backend and database containers, with AI and LiteAPI off as in the cloud.
      - name: Start Student 1 backend and database
        env:
          AI_ENABLED: "false"
          LITEAPI_KEY: ""
        run: docker compose up --detach --no-deps --wait student1-database student1-backend

      - name: Post-commit endpoint tests (POST and PATCH /api/searches)
        env:
          STUDENT1_BACKEND_URL: http://localhost:5201
        # pytest is already installed from the MCP requirements by the feature test step.
        run: python -m pytest student-1/tests/test_endpoints_cicd.py -v --junitxml=student-1/endpoint-tests-junit.xml

      - name: Publish endpoint test report
        if: ${{ always() && hashFiles('student-1/endpoint-tests-junit.xml') != '' }}
        run: python scripts/test/junit_summary.py student-1/endpoint-tests-junit.xml "Student 1 post-commit endpoint tests (POST and PATCH /api/searches)"

      - name: Upload endpoint test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-1-endpoint-test-results
          path: student-1/endpoint-tests-junit.xml

      - name: Show Student 1 container logs on failure
        if: failure()
        run: docker compose logs --no-color student1-database student1-backend

      - name: Stop Student 1 services
        if: always()
        run: docker compose down

  agentic-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test shared agentic loop
        run: pwsh -NoProfile -File scripts/test/student-1.ps1 -Area AgenticLoop
      - name: Publish native shared agentic loop
        run: dotnet publish ai-services/agentic-loop/AgenticLoop.csproj --configuration Release --output /tmp/asd-agentic-loop
