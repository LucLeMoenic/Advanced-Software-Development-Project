name: Student 1 CI

permissions:
  contents: read

on:
  push:
    paths:
      - "student-1/**"
      - "Mitchell-Harris-Feature(Accomidation)/**"
      - "ai-services/agentic-loop/**"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/verify-agentic-models.ps1"
      - ".github/workflows/student-1.yml"
  pull_request:
    paths:
      - "student-1/**"
      - "Mitchell-Harris-Feature(Accomidation)/**"
      - "ai-services/agentic-loop/**"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/verify-agentic-models.ps1"
      - ".github/workflows/student-1.yml"

jobs:
  agentic-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test shared agentic loop
        run: dotnet test ai-services/agentic-loop/tests/AgenticLoop.Tests.csproj --configuration Release
      - name: Build shared agentic loop container
        run: docker build --tag asd-agentic-loop:ci ai-services/agentic-loop
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build agentic loop through Compose
        run: docker compose build agentic-loop
