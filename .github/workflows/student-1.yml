name: Student 1 CI

permissions:
  contents: read

on:
  push:
    paths:
      - "student-1/**"
      - "shared/vue-frontend/**"
      - "ai-services/agentic-loop/**"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/test/verify-agentic-models.ps1"
      - "scripts/test/student-1.ps1"
      - ".github/workflows/student-1.yml"
  pull_request:
    paths:
      - "student-1/**"
      - "shared/vue-frontend/**"
      - "ai-services/agentic-loop/**"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/test/verify-agentic-models.ps1"
      - "scripts/test/student-1.ps1"
      - ".github/workflows/student-1.yml"

jobs:
  accommodation-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: student-1/frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test Student 1 feature
        run: pwsh -NoProfile -File scripts/test/student-1.ps1 -Area Feature
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build integrated Student 1 containers
        run: docker compose build shared-frontend student1-frontend student1-backend student1-database

  agentic-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test shared agentic loop
        run: pwsh -NoProfile -File scripts/test/student-1.ps1 -Area AgenticLoop
      - name: Build shared agentic loop container
        run: docker build --tag asd-agentic-loop:ci ai-services/agentic-loop
      - name: Build agentic loop through Compose
        run: docker compose build agentic-loop
