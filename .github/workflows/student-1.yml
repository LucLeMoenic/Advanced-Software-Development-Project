name: Student 1 CI

permissions:
  contents: read

on:
  push:
    paths:
      - "student-1/**"
      - "shared/vue-frontend/**"
      - "ai-services/agentic-loop/**"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/verify-agentic-models.ps1"
      - ".github/workflows/student-1.yml"
  pull_request:
    paths:
      - "student-1/**"
      - "shared/vue-frontend/**"
      - "ai-services/agentic-loop/**"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/verify-agentic-models.ps1"
      - ".github/workflows/student-1.yml"

jobs:
  accommodation-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: student-1/frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install frontend dependencies
        working-directory: student-1/frontend
        run: npm ci
      - name: Test frontend
        working-directory: student-1/frontend
        run: npm test
      - name: Type-check and build frontend
        working-directory: student-1/frontend
        run: npm run build
      - name: Restore backend dependencies
        run: dotnet restore student-1/backend/tests/Backend.Tests.csproj
      - name: Test backend
        run: dotnet test student-1/backend/tests/Backend.Tests.csproj --configuration Release --no-restore
      - name: Restore database API dependencies
        run: dotnet restore student-1/database/tests/Database.Tests.csproj
      - name: Test database API
        run: dotnet test student-1/database/tests/Database.Tests.csproj --configuration Release --no-restore
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build integrated Student 1 containers
        run: docker compose build shared-frontend student1-frontend student1-backend student1-database

  agentic-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore shared agentic loop dependencies
        run: dotnet restore ai-services/agentic-loop/tests/AgenticLoop.Tests.csproj
      - name: Test shared agentic loop
        run: dotnet test ai-services/agentic-loop/tests/AgenticLoop.Tests.csproj --configuration Release --no-restore
      - name: Build shared agentic loop container
        run: docker build --tag asd-agentic-loop:ci ai-services/agentic-loop
      - name: Build agentic loop through Compose
        run: docker compose build agentic-loop
