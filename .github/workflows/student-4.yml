name: Student 4 CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - "student-4/**"
      - "shared/vue-frontend/**"
      - "package.json"
      - "scripts/test/student-4.ps1"
      - "ai-services/agentic-loop/**"
      - "ai-services/mcp-server/**"
      - "ai-services/rag-server/**"
      - "ai-services/multi-agent-server/**"
      - "scripts/test/test_cloud_smoke_student4.py"
      - "scripts/deploy/smoke_cloud.py"
      - ".env.example"
      - ".github/workflows/student-4.yml"
      - "docker-compose.yml"
  pull_request:
    paths:
      - "student-4/**"
      - "shared/vue-frontend/**"
      - "package.json"
      - "scripts/test/student-4.ps1"
      - "ai-services/agentic-loop/**"
      - "ai-services/mcp-server/**"
      - "ai-services/rag-server/**"
      - "ai-services/multi-agent-server/**"
      - "scripts/test/test_cloud_smoke_student4.py"
      - "scripts/deploy/smoke_cloud.py"
      - ".env.example"
      - ".github/workflows/student-4.yml"
      - "docker-compose.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_ENABLED: "false"
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MULTI_AGENT_ENABLED: "false"
      STUDENT4_AI_ENABLED: "false"
      STUDENT4_MCP_ENABLED: "false"
      STUDENT4_RAG_ENABLED: "false"
      STUDENT4_MULTI_AGENT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            student-4/frontend/package-lock.json
            shared/vue-frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install isolated shared Python test dependencies
        shell: bash
        run: |
          python -m venv .venv-student4-mcp
          python -m venv .venv-student4-rag
          .venv-student4-mcp/bin/python -m pip install --disable-pip-version-check -r ai-services/mcp-server/requirements.txt
          .venv-student4-rag/bin/python -m pip install --disable-pip-version-check -r ai-services/rag-server/requirements.txt
          echo "STUDENT4_MCP_PYTHON=$GITHUB_WORKSPACE/.venv-student4-mcp/bin/python" >> "$GITHUB_ENV"
          echo "STUDENT4_RAG_PYTHON=$GITHUB_WORKSPACE/.venv-student4-rag/bin/python" >> "$GITHUB_ENV"

      - name: Validate source and tests
        run: pwsh -NoProfile -File scripts/test/student-4.ps1 -Area All

      - name: Release 2 preview and workflow endpoint functions
        run: >-
          dotnet test student-4/backend/tests/Backend.Tests.csproj --configuration Release
          --filter "FullyQualifiedName~EndpointTests.WhatIfPreviewUsesCurrentActualsAndDoesNotMutateSource|FullyQualifiedName~EndpointTests.WhatIfStartPollAndAllHumanDecisionsArePreviewOnly"
          --logger "trx;LogFileName=student4-release2-endpoints.trx"
          --results-directory student-4/test-results

      - name: Retain Release 2 endpoint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student4-release2-endpoints-${{ github.sha }}
          path: student-4/test-results/*.trx
          if-no-files-found: warn

      - name: Validate Student 4 cloud baseline checks
        run: .venv-student4-mcp/bin/python -m pytest scripts/test/test_cloud_smoke_student4.py -q

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Build integrated Student 4 containers
        run: bash scripts/ci/retry-transient.sh 3 20 docker compose build shared-frontend student4-frontend student4-backend student4-database

      - name: Start Student 4 services through shared route
        run: docker compose up --detach --no-deps --wait student4-database student4-backend student4-frontend shared-frontend

      - name: Smoke test Student 4 integration
        shell: bash
        run: |
          curl --fail --silent http://localhost:5100/health
          curl --fail --silent http://localhost:5104/health
          curl --fail --silent http://localhost:5204/health
          curl --fail --silent http://localhost:5304/health
          curl --fail --silent http://localhost:5304/api/data/budgets | python3 -c "import json,sys; values=json.load(sys.stdin); assert len(values) >= 10"
          curl --fail --silent http://localhost:5304/api/data/expenses | python3 -c "import json,sys; values=json.load(sys.stdin); assert len(values) >= 10"
          curl --fail --silent 'http://localhost:5204/api/dashboard?journeyLabel=Sydney%20Weekender' | python3 -c "import json,sys; value=json.load(sys.stdin); assert len(value['categories']) >= 1"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --retry-all-errors http://localhost:5100/budget/ | grep --quiet 'Budget &amp; Expense Tracker'

      - name: Stop services
        if: always()
        run: docker compose down
