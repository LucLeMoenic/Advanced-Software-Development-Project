name: Student 3 CI

permissions:
  contents: read

on:
  push:
    paths:
      - 'student-3/**'
      - 'shared/vue-frontend/**'
      - '.github/workflows/student-3.yml'
      - 'docker-compose.yml'
      - 'scripts/test/student-3.ps1'
  pull_request:
    paths:
      - 'student-3/**'
      - 'shared/vue-frontend/**'
      - '.github/workflows/student-3.yml'
      - 'docker-compose.yml'
      - 'scripts/test/student-3.ps1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Student 3 services
        run: pwsh -NoProfile -File scripts/test/student-3.ps1

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Build integrated Student 3 containers
        run: docker compose build shared-frontend student3-frontend student3-backend student3-database student3-db-init

      - name: Initialise and seed Student 3 database
        run: docker compose run --rm --no-deps student3-db-init

      - name: Start Student 3 services
        run: docker compose up --detach --no-deps --wait student3-database student3-backend student3-frontend

      - name: Smoke test Student 3 integration
        run: |
          curl --fail --silent http://localhost:5103/health
          curl --fail --silent http://localhost:5203/health
          curl --fail --silent http://localhost:5303/health
          curl --fail --silent http://localhost:5203/api/attractions | python -c "import json,sys; attractions=json.load(sys.stdin); assert len(attractions) >= 10"

      - name: Stop Student 3 services
        if: always()
        run: docker compose down
