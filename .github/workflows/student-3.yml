name: Student 3 CI

on:
  push:
    paths:
      - 'student-3/**'
      - '.github/workflows/student-3.yml'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'student-3/**'
      - '.github/workflows/student-3.yml'
      - 'docker-compose.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend/test dependencies
        run: pip install -r student-3/backend/requirements.txt

      - name: Run pytest
        run: pytest student-3/tests

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build Student 3 frontend container
        run: docker build -t student3-frontend -f student-3/frontend/Dockerfile student-3/frontend

      - name: Build Student 3 backend container
        run: docker build -t student3-backend -f student-3/backend/Dockerfile student-3/backend

      - name: Build Student 3 database container
        run: docker build -t student3-database -f student-3/database/Dockerfile student-3/database
