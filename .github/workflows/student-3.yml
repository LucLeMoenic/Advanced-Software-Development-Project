name: Student 3 CI

permissions:
  contents: read

on:
  push:
    paths:
      - 'student-3/**'
      - 'ai-services/mcp-server/**'
      - 'ai-services/rag-server/**'
      - 'ai-services/multi-agent-server/**'
      - 'ai-services/agentic-loop/prompts/multi-agent-*'
      - 'shared/vue-frontend/**'
      - '.github/workflows/student-3.yml'
      - 'docker-compose.yml'
      - 'scripts/test/student-3.ps1'
      - 'scripts/test/junit_summary.py'
      - 'scripts/ci/retry-transient.sh'
      - 'scripts/test/test_retry_transient.py'
  pull_request:
    paths:
      - 'student-3/**'
      - 'ai-services/mcp-server/**'
      - 'ai-services/rag-server/**'
      - 'ai-services/multi-agent-server/**'
      - 'ai-services/agentic-loop/prompts/multi-agent-*'
      - 'shared/vue-frontend/**'
      - '.github/workflows/student-3.yml'
      - 'docker-compose.yml'
      - 'scripts/test/student-3.ps1'
      - 'scripts/test/junit_summary.py'
      - 'scripts/ci/retry-transient.sh'
      - 'scripts/test/test_retry_transient.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Student 3 services
        run: pwsh -NoProfile -File scripts/test/student-3.ps1

      # Release 2 post-commit CI/CD endpoint testing: two endpoint functions of
      # the Student 3 backend/API, exercised end to end (real backend app ->
      # real database app, no mocks) on every push touching Student 3.
      - name: Post-commit endpoint tests (GET and POST /api/attractions)
        working-directory: student-3
        run: python -m pytest tests/test_endpoints_cicd.py -v --junitxml=endpoint-tests-junit.xml

      - name: Publish endpoint test report
        if: ${{ always() && hashFiles('student-3/endpoint-tests-junit.xml') != '' }}
        run: python scripts/test/junit_summary.py student-3/endpoint-tests-junit.xml "Student 3 post-commit endpoint tests (GET and POST /api/attractions)"

      - name: Upload endpoint test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-3-endpoint-test-results
          path: student-3/endpoint-tests-junit.xml

      # Release 2: the shared Multi-Agent Server (Planner, Worker, Reviewer, human decision, audit chain).
      # Offline: a scripted fake model stands in for Ollama.
      - name: Test Multi-Agent Server
        working-directory: ai-services/multi-agent-server
        run: |
          pip install -r requirements.txt
          python -m pytest -v --junitxml=multi-agent-junit.xml

      - name: Publish Multi-Agent Server test report
        if: ${{ always() && hashFiles('ai-services/multi-agent-server/multi-agent-junit.xml') != '' }}
        run: python scripts/test/junit_summary.py ai-services/multi-agent-server/multi-agent-junit.xml "Multi-Agent Server tests"

      # The image builds below go through scripts/ci/retry-transient.sh (retries registry/network blips only).
      - name: Test the CI retry wrapper
        run: python -m pytest scripts/test/test_retry_transient.py -q

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Build integrated Student 3 containers
        run: bash scripts/ci/retry-transient.sh 3 20 docker compose build shared-frontend student3-frontend student3-backend student3-database student3-db-init

      - name: Initialise and seed Student 3 database
        run: docker compose run --rm --no-deps student3-db-init

      - name: Start Student 3 services
        env:
          MCP_ENABLED: "false"
          RAG_ENABLED: "false"
          MULTI_AGENT_ENABLED: "false"
          AI_ENABLED: "false"
        run: docker compose up --detach --no-deps --wait student3-database student3-backend student3-frontend

      - name: Post-commit endpoint tests against running containers (GET and POST /api/attractions)
        run: python student-3/tests/live_endpoint_check.py http://localhost:5203

      - name: Smoke test Student 3 integration
        run: |
          curl --fail --silent http://localhost:5103/health
          curl --fail --silent http://localhost:5203/health
          curl --fail --silent http://localhost:5303/health
          curl --fail --silent http://localhost:5203/api/attractions | python -c "import json,sys; attractions=json.load(sys.stdin); assert len(attractions) >= 10"

          # MCP/RAG are integrated but disabled in CI (see .env.example) - assert
          # both routes fail closed with the documented disabled body instead of
          # making a network call to a shared server that isn't running here.
          curl --silent --write-out '\n%{http_code}' http://localhost:5203/api/mcp/tools \
            | python -c "
          import json, sys
          *body_lines, status = sys.stdin.read().splitlines()
          assert status == '503', status
          assert json.loads('\n'.join(body_lines)) == {'error': 'mcp_disabled', 'message': 'MCP is disabled.'}
          "
          curl --silent --write-out '\n%{http_code}' -X POST http://localhost:5203/api/mcp/invoke \
            -H 'Content-Type: application/json' -d '{"tool":"attractions.search","arguments":{}}' \
            | python -c "
          import json, sys
          *body_lines, status = sys.stdin.read().splitlines()
          assert status == '503', status
          assert json.loads('\n'.join(body_lines)) == {'error': 'mcp_disabled', 'message': 'MCP is disabled.'}
          "
          curl --silent --write-out '\n%{http_code}' -X POST http://localhost:5203/api/rag/ask \
            -H 'Content-Type: application/json' -d '{"question":"anything"}' \
            | python -c "
          import json, sys
          *body_lines, status = sys.stdin.read().splitlines()
          assert status == '503', status
          assert json.loads('\n'.join(body_lines)) == {'error': 'rag_disabled', 'message': 'RAG is disabled.'}
          "

      # Release 2: the Multi-Agent routes fail closed when disabled (the default, and the cloud baseline).
      - name: Assert Multi-Agent routes are disabled by default
        run: |
          for spec in "GET /api/agents/status" "POST /api/agents/workflows" \
                      "GET /api/agents/workflows/wf-20261019T011611Z-0ccf5c1c" \
                      "POST /api/agents/workflows/wf-20261019T011611Z-0ccf5c1c/decision"; do
            method=${spec%% *}; path=${spec#* }
            curl --silent --write-out '\n%{http_code}' -X "$method" "http://localhost:5203$path" \
              -H 'Content-Type: application/json' -d '{"task":"Plan a day","decision":"approve"}' \
              | python -c "
          import json, sys
          *body_lines, status = sys.stdin.read().splitlines()
          assert status == '503', status
          assert json.loads('\n'.join(body_lines)) == {'error': 'multi_agent_disabled', 'message': 'Multi-Agent is disabled.'}
          "
            echo "disabled as expected: $spec"
          done

      # Release 2 cloud baseline: AI-Mode, MCP, RAG and Multi-Agent all report off, and AI-Mode still answers
      # deterministically from the catalogue without contacting a model.
      - name: Assert every AI capability is off and AI-Mode falls back deterministically
        run: |
          curl --fail --silent http://localhost:5203/api/capabilities | python -c "
          import json, sys
          assert json.load(sys.stdin) == {'aiEnabled': False, 'mcpEnabled': False, 'ragEnabled': False, 'multiAgentEnabled': False}
          "
          curl --fail --silent -X POST http://localhost:5203/api/recommend \
            -H 'Content-Type: application/json' -d '{"interest":"street art"}' | python -c "
          import json, sys
          body = json.load(sys.stdin)
          assert body['source'] == 'fallback', body
          assert body['attractions_considered'], body
          "

      - name: Stop Student 3 services
        if: always()
        run: docker compose down
