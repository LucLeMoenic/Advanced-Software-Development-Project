name: Student 3 CI

on:
  push:
    paths:
      - 'student-3/**'
      - '.github/workflows/student-3.yml'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'student-3/**'
      - '.github/workflows/student-3.yml'
      - 'docker-compose.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build Student 3 frontend container
        run: docker build -t student3-frontend -f student-3/frontend/Dockerfile student-3/frontend
