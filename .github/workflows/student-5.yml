name: Student 5 CI

permissions:
  contents: read

on:
  push:
    paths:
      - "student-5/**"
      - "shared/vue-frontend/**"
      - "docker-compose.yml"
      - "scripts/test/student-5.ps1"
      - "scripts/test/junit_summary.py"
      - ".github/workflows/student-5.yml"
      - "ai-services/mcp-server/requirements.txt"
      - "ai-services/mcp-server/tools/__init__.py"
      - "ai-services/mcp-server/tools/logistics.py"
      - "ai-services/mcp-server/tests/test_logistics_tools.py"
      - "ai-services/rag-server/requirements.txt"
      - "ai-services/rag-server/retrieval.py"
      - "ai-services/rag-server/confidence.py"
      - "ai-services/rag-server/knowledge/student-5/**"
      - "ai-services/rag-server/tests/test_student5_retrieval.py"
  pull_request:
    paths:
      - "student-5/**"
      - "shared/vue-frontend/**"
      - "docker-compose.yml"
      - "scripts/test/student-5.ps1"
      - "scripts/test/junit_summary.py"
      - ".github/workflows/student-5.yml"
      - "ai-services/mcp-server/requirements.txt"
      - "ai-services/mcp-server/tools/__init__.py"
      - "ai-services/mcp-server/tools/logistics.py"
      - "ai-services/mcp-server/tests/test_logistics_tools.py"
      - "ai-services/rag-server/requirements.txt"
      - "ai-services/rag-server/retrieval.py"
      - "ai-services/rag-server/confidence.py"
      - "ai-services/rag-server/knowledge/student-5/**"
      - "ai-services/rag-server/tests/test_student5_retrieval.py"

jobs:
  logistics-services:
    runs-on: ubuntu-latest
    # CI has no native Ollama, MCP or RAG server, so the integrations stay
    # disabled and the smoke test asserts they fail closed.
    env:
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            student-5/database/requirements.txt
            student-5/backend/requirements.txt
            ai-services/mcp-server/requirements.txt
            ai-services/rag-server/requirements.txt

      - name: Test Student 5 services, MCP tools and RAG retrieval
        run: pwsh -NoProfile -File scripts/test/student-5.ps1

      # Release 2 post-commit CI/CD endpoint testing (TL-NFR-11): the two endpoint
      # functions of the Student 5 backend/API, with the database API mocked and
      # every AI capability off as in the cloud baseline. The live container run
      # of the same two endpoints follows after compose up. The env below documents
      # the baseline; the tests' ai_off_client fixture also pins all four off.
      - name: Post-commit endpoint tests (POST and PUT /api/destinations)
        env:
          AI_ENABLED: "false"
          MCP_ENABLED: "false"
          RAG_ENABLED: "false"
          MULTI_AGENT_ENABLED: "false"
        run: python -m pytest student-5/backend/tests/test_endpoints_cicd.py -v --junitxml=student-5/endpoint-tests-junit.xml

      - name: Publish endpoint test report
        if: ${{ always() && hashFiles('student-5/endpoint-tests-junit.xml') != '' }}
        run: python scripts/test/junit_summary.py student-5/endpoint-tests-junit.xml "Student 5 post-commit endpoint tests (POST and PUT /api/destinations)"

      - name: Upload endpoint test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-5-endpoint-test-results
          path: student-5/endpoint-tests-junit.xml

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Build integrated Student 5 containers
        run: bash scripts/ci/retry-transient.sh 3 20 docker compose build student5-database student5-backend student5-frontend

      - name: Start Student 5 services
        env:
          AI_ENABLED: "false"
          MCP_ENABLED: "false"
          RAG_ENABLED: "false"
          MULTI_AGENT_ENABLED: "false"
        run: docker compose up --detach --no-deps --wait student5-database student5-backend student5-frontend

      - name: Smoke test Student 5 integration
        run: |
          curl --fail --silent http://localhost:5305/health
          curl --fail --silent http://localhost:5205/health
          curl --fail --silent http://localhost:5105/ > /dev/null
          curl --fail --silent http://localhost:5205/api/destinations | python -c "import json,sys; assert len(json.load(sys.stdin)) >= 12"

          # AI-Mode, MCP and RAG are integrated but disabled here: assert the
          # documented fail-closed 503 bodies instead of calling servers CI does not run.
          check_disabled() {
            curl --silent --write-out '\n%{http_code}' "$@" | python -c "
          import json, sys
          *body, status = sys.stdin.read().splitlines()
          assert status == '503', status
          error = json.loads('\n'.join(body))['error']
          assert error in ('ai_disabled', 'mcp_disabled', 'rag_disabled'), error
          "
          }
          check_disabled http://localhost:5205/api/mcp/tools
          check_disabled -X POST http://localhost:5205/api/mcp/invoke -H 'Content-Type: application/json' \
            -d '{"tool":"logistics.get_weather","arguments":{"destination_id":1}}'
          check_disabled -X POST http://localhost:5205/api/rag/ask -H 'Content-Type: application/json' \
            -d '{"question":"What is an eVisa?"}'
          check_disabled -X POST http://localhost:5205/api/advisory -H 'Content-Type: application/json' \
            -d '{"destination_id":1}'
          # Through the frontend proxy too, so the browser path is covered.
          check_disabled -X POST http://localhost:5105/api/rag/ask -H 'Content-Type: application/json' \
            -d '{"question":"What is an eVisa?"}'

      # The same two endpoints over HTTP against the running containers, so the run
      # proves the real backend -> database API -> SQLite path. Its row is deleted.
      - name: Post-commit endpoint tests against running containers (POST and PUT /api/destinations)
        run: python student-5/backend/tests/live_endpoint_check.py http://localhost:5205

      - name: Show Student 5 container logs on failure
        if: failure()
        run: docker compose logs --no-color student5-database student5-backend student5-frontend

      - name: Stop Student 5 services
        if: always()
        run: docker compose down
