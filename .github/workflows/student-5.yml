name: Student 5 CI

permissions:
  contents: read

on:
  push:
    paths:
      - "student-5/**"
      - "docker-compose.yml"
      - "scripts/test/student-5.ps1"
      - ".github/workflows/student-5.yml"
  pull_request:
    paths:
      - "student-5/**"
      - "docker-compose.yml"
      - "scripts/test/student-5.ps1"
      - ".github/workflows/student-5.yml"

jobs:
  logistics-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            student-5/database/requirements.txt
            student-5/backend/requirements.txt

      - name: Test Student 5 services
        run: pwsh -NoProfile -File scripts/test/student-5.ps1

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Build integrated Student 5 containers
        run: docker compose build student5-database student5-backend student5-frontend
