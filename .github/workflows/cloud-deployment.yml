name: Cloud Deployment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Deploy baseline, deploy password-protected AI, or prepare an AI bundle"
        type: choice
        default: baseline
        options:
          - baseline
          - prepare-ai
          - ai

permissions:
  contents: read
  actions: read

concurrency:
  group: cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    environment: prod
    env:
      CLOUD_HOST: ${{ vars.CLOUD_HOST }}
      CLOUD_USER: ${{ vars.CLOUD_USER }}
      CLOUD_DOMAIN: ${{ vars.CLOUD_DOMAIN }}
      CLOUD_AI_SERVICES: ${{ (inputs.mode == 'prepare-ai' || inputs.mode == 'ai') && 'ai,mcp,rag,multi-agent' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Require all CI for the deployed revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -File scripts/deploy/assert-cloud-ci.ps1 -Sha "$GITHUB_SHA"
      - name: Require protected AI credentials
        if: inputs.mode == 'ai'
        env:
          CLOUD_AUTH_USER: ${{ secrets.CLOUD_AUTH_USER }}
          CLOUD_AUTH_PASSWORD: ${{ secrets.CLOUD_AUTH_PASSWORD }}
        run: python scripts/deploy/cloud_auth.py check
      - name: Prepare and validate cloud configuration
        run: |
          python scripts/deploy/prepare_cloud.py --sha "$GITHUB_SHA" --domain "$CLOUD_DOMAIN" --ai-services "$CLOUD_AI_SERVICES" --output cloud-bundle
          docker compose -f cloud-bundle/compose.json config --quiet
      - name: Build immutable application images
        run: |
          docker compose -f cloud-bundle/compose-build.json build
          docker pull caddy:2.10.2-alpine
          mapfile -t images < cloud-bundle/images.txt
          docker image save --output cloud-bundle/images.tar "${images[@]}"
          cd cloud-bundle
          sha256sum compose.json Caddyfile revision.txt smoke_cloud.py smoke_cloud_ai.py cloud_auth.py \
            accommodation.db deploy-vm.sh pull-models-vm.sh ai-services.txt vm-pull-images.txt images.tar > SHA256SUMS
      - name: Package AI preparation without deployment
        if: inputs.mode == 'prepare-ai'
        run: |
          tar -cf cloud-ai-bundle.tar -C cloud-bundle \
            compose.json Caddyfile revision.txt smoke_cloud.py smoke_cloud_ai.py cloud_auth.py \
            accommodation.db deploy-vm.sh pull-models-vm.sh ai-services.txt vm-pull-images.txt images.tar SHA256SUMS
          echo "::notice::AI bundle prepared only. Gateway credentials are not included; no SSH connection or model download was attempted."
      - name: Retain AI preparation bundle
        if: inputs.mode == 'prepare-ai'
        uses: actions/upload-artifact@v6
        with:
          name: cloud-ai-preparation-${{ github.sha }}
          path: cloud-ai-bundle.tar
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Prepare private gateway credentials
        if: inputs.mode == 'ai'
        env:
          CLOUD_AUTH_USER: ${{ secrets.CLOUD_AUTH_USER }}
          CLOUD_AUTH_PASSWORD: ${{ secrets.CLOUD_AUTH_PASSWORD }}
        run: python scripts/deploy/cloud_auth.py prepare "$RUNNER_TEMP/gateway-auth.caddy"
      - name: Configure pinned SSH access
        if: inputs.mode != 'prepare-ai'
        env:
          SSH_KEY: ${{ secrets.CLOUD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CLOUD_KNOWN_HOSTS }}
        run: |
          [[ "$CLOUD_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] && [[ "$CLOUD_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy to the approved Azure or AWS Linux VM
        if: inputs.mode != 'prepare-ai'
        timeout-minutes: 40
        env:
          DEPLOY_MODE: ${{ inputs.mode }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$CLOUD_USER@$CLOUD_HOST" "umask 077; mkdir -p asd-upload/$GITHUB_SHA"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes cloud-bundle/{compose.json,Caddyfile,revision.txt,smoke_cloud.py,smoke_cloud_ai.py,cloud_auth.py,accommodation.db,deploy-vm.sh,pull-models-vm.sh,ai-services.txt,vm-pull-images.txt,images.tar,SHA256SUMS} "$CLOUD_USER@$CLOUD_HOST:asd-upload/$GITHUB_SHA/"
          if [[ "$DEPLOY_MODE" == ai ]]; then
            scp -o BatchMode=yes -o StrictHostKeyChecking=yes "$RUNNER_TEMP/gateway-auth.caddy" "$CLOUD_USER@$CLOUD_HOST:asd-upload/$GITHUB_SHA/gateway-auth.caddy"
          fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$CLOUD_USER@$CLOUD_HOST" "bash asd-upload/$GITHUB_SHA/deploy-vm.sh $GITHUB_SHA"
      - name: Wait for public HTTPS readiness
        if: inputs.mode != 'prepare-ai'
        timeout-minutes: 5
        env:
          DEPLOY_MODE: ${{ inputs.mode }}
          CLOUD_AUTH_USER: ${{ inputs.mode == 'ai' && secrets.CLOUD_AUTH_USER || '' }}
          CLOUD_AUTH_PASSWORD: ${{ inputs.mode == 'ai' && secrets.CLOUD_AUTH_PASSWORD || '' }}
        run: |
          args=()
          if [[ "$DEPLOY_MODE" == ai ]]; then args+=(--required); fi
          python scripts/deploy/cloud_auth.py verify "https://$CLOUD_DOMAIN" "${args[@]}"
      - name: Verify public gateway and Student 1 to 5 CRUD
        if: inputs.mode != 'prepare-ai' && inputs.mode != 'ai'
        run: |
          set -o pipefail
          python scripts/deploy/smoke_cloud.py "https://$CLOUD_DOMAIN" | tee cloud-bundle/cloud-smoke.txt
      - name: Verify protected group CRUD and AI integrations
        if: inputs.mode == 'ai'
        timeout-minutes: 60
        env:
          CLOUD_AUTH_USER: ${{ secrets.CLOUD_AUTH_USER }}
          CLOUD_AUTH_PASSWORD: ${{ secrets.CLOUD_AUTH_PASSWORD }}
        run: |
          set -o pipefail
          python -u scripts/deploy/smoke_cloud_ai.py "https://$CLOUD_DOMAIN" \
            --components "$CLOUD_AI_SERVICES" --all-features | tee cloud-bundle/cloud-smoke.txt
      - name: Retain deployment evidence
        if: ${{ always() && hashFiles('cloud-bundle/compose.json', 'cloud-bundle/revision.txt', 'cloud-bundle/SHA256SUMS', 'cloud-bundle/cloud-smoke.txt') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: cloud-${{ inputs.mode || 'baseline' }}-evidence-${{ github.sha }}
          path: |
            cloud-bundle/compose.json
            cloud-bundle/revision.txt
            cloud-bundle/SHA256SUMS
            cloud-bundle/cloud-smoke.txt
            cloud-bundle/ai-services.txt
            cloud-bundle/vm-pull-images.txt
      - name: Remove runner credentials
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts "$RUNNER_TEMP/gateway-auth.caddy"
