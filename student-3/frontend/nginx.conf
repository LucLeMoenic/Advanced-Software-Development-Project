server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11) - re-resolve student3-backend on
    # every request instead of caching the IP nginx saw at startup. Without
    # this, a proxy_pass to a bare hostname is resolved once and goes stale
    # the moment the backend container restarts and gets a new IP.
    resolver 127.0.0.11 valid=10s;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    location /api/ {
        set $backend http://student3-backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
