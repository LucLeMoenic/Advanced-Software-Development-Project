server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11) - re-resolve student3-backend on
    # every request instead of caching the IP nginx saw at startup. Without
    # this, a proxy_pass to a bare hostname is resolved once and goes stale
    # the moment the backend container restarts and gets a new IP.
    resolver 127.0.0.11 valid=10s;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    location /api/ {
        set $backend http://student3-backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/recommend can call Ollama twice (an initial attempt, then one
        # ADAPT-stage retry on a bad response), each individually bounded by
        # the backend's own OLLAMA_TIMEOUT (120s, see recommend.py) - so
        # nginx's 60s default proxy_read_timeout can kill the connection and
        # return a 504 before the backend's retry-then-fallback logic ever
        # gets to respond. Observed directly: a single warm call already
        # took ~53s in this environment. Set comfortably above the
        # worst-case 2x120s = 240s ceiling.
        proxy_read_timeout 250s;
        proxy_send_timeout 250s;
    }

    # Same backend, reached via the shared gateway's distinct-prefix
    # convention (see /itinerary-api/ and /budget-api/ on the gateway):
    # /attractions-api/ rewrites to /api/ so the gateway can proxy this
    # service's browser-issued requests without colliding with student1's
    # /api/ reservation. Kept alongside the /api/ block above so requests
    # made directly against this container's own published port keep working
    # unchanged.
    location /attractions-api/ {
        set $backend http://student3-backend:8080;
        rewrite ^/attractions-api/(.*)$ /api/$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 250s;
        proxy_send_timeout 250s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
