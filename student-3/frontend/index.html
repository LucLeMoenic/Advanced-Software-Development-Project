<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Experience &amp; Attraction Recommender</title>
  <link rel="stylesheet" href="style.css">
  <script
    src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"
    integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2"
    crossorigin="anonymous"></script>
</head>
<body>
  <!--
    Standalone Release 0 page for the student-3 slice. Structured so the
    <main> content below can be dropped into shared/index.html later with
    minimal rework: section markup is self-contained, and styling should
    move to the shared CSS theme rather than living only in style.css.
  -->
  <header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;">
    <div>
      <h1>Local Experience &amp; Attraction Recommender</h1>
      <p class="tagline">Browse attractions or ask the AI for a suggestion.</p>
    </div>
    <a href="/" style="color: inherit;">All features</a>
  </header>

  <main>
    <section id="browse" aria-labelledby="browse-heading">
      <h2 id="browse-heading">Browse Attractions</h2>

      <div class="filters" role="group" aria-label="Filter by category">
        <button
          type="button"
          hx-get="/attractions-api/attractions"
          hx-trigger="load, click"
          hx-swap="none"
          hx-on:click="currentCategory = null"
          hx-on::after-request="renderAttractions(event)">
          All
        </button>
        <button
          type="button"
          hx-get="/attractions-api/attractions?category=sight"
          hx-swap="none"
          hx-on:click="currentCategory = 'sight'"
          hx-on::after-request="renderAttractions(event)">
          Sights
        </button>
        <button
          type="button"
          hx-get="/attractions-api/attractions?category=restaurant"
          hx-swap="none"
          hx-on:click="currentCategory = 'restaurant'"
          hx-on::after-request="renderAttractions(event)">
          Restaurants
        </button>
        <button
          type="button"
          hx-get="/attractions-api/attractions?category=activity"
          hx-swap="none"
          hx-on:click="currentCategory = 'activity'"
          hx-on::after-request="renderAttractions(event)">
          Activities
        </button>
      </div>

      <div id="attraction-list" class="card-grid" aria-live="polite">
        <p class="loading">Loading attractions...</p>
      </div>
    </section>

    <section id="recommend" aria-labelledby="recommend-heading">
      <h2 id="recommend-heading">Ask the AI</h2>
      <p>Tell us what you're interested in and we'll suggest something from the catalogue.</p>

      <form
        id="recommend-form"
        hx-post="/attractions-api/recommend"
        hx-swap="none"
        hx-on::before-request="handleRecommendStart(this)"
        hx-on::after-request="renderRecommendation(event, this)">
        <label for="interest">Your interests</label>
        <input
          id="interest"
          name="interest"
          type="text"
          placeholder="e.g. I like street art and casual Asian food"
          required
          minlength="3"
          maxlength="200">
        <button type="submit">Get Recommendation</button>
      </form>

      <div id="recommend-result" aria-live="polite"></div>
      <p class="recommend-elapsed"><span id="recommend-elapsed" aria-hidden="true"></span></p>
    </section>

    <section id="manage" aria-labelledby="manage-heading">
      <h2 id="manage-heading">Add an Attraction</h2>

      <form
        id="create-attraction-form"
        hx-ext="json-body"
        hx-post="/attractions-api/attractions"
        hx-swap="none"
        hx-on::after-request="handleCreateAttraction(event)">
        <label for="create-name">Name</label>
        <input id="create-name" name="name" type="text" required maxlength="200">

        <label for="create-category">Category</label>
        <select id="create-category" name="category" required>
          <option value="sight">Sight</option>
          <option value="restaurant">Restaurant</option>
          <option value="activity">Activity</option>
        </select>

        <label for="create-description">Description</label>
        <textarea id="create-description" name="description" rows="3" maxlength="500"></textarea>

        <label for="create-rating">Rating</label>
        <input id="create-rating" name="rating" type="number" min="0" max="5" step="0.5">

        <button type="submit">Add attraction</button>
      </form>

      <div id="create-result" aria-live="polite"></div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    // Elapsed-time readout for the "Get Recommendation" wait.
    //
    // app.js's handleRecommendStart comment notes the backend's Ollama call
    // can take anywhere from a couple of seconds up to most of
    // OLLAMA_TIMEOUT's 120s (cold model, or a retry that doubles the call
    // count). A static "this can take up to a minute." sentence with
    // nothing moving on screen is indistinguishable from a hang, so this
    // counter fills that gap.
    var recommendForm = document.getElementById('recommend-form');
    var elapsedOutput = document.getElementById('recommend-elapsed');
    var elapsedTimer = null;

    /**
     * Render the running wait time for the current recommend request.
     *
     * Called once with 0 the moment the request is sent, then once per
     * second until it settles. The return value is dropped straight into
     * the "#recommend-elapsed" span below the result box.
     *
     * Returns an empty string for the first 2 seconds, so the static
     * loading sentence in #recommend-result lands on its own first; a
     * compact form such as "14s" from 2 seconds; and past 45 seconds a
     * reassurance form such as "still working - 52s" so a slow generation
     * does not read as a hang.
     *
     * @param {number} seconds Whole seconds since the request was sent.
     * @returns {string} Text to show, or "" to show nothing this tick.
     */
    function formatElapsed(seconds) {
      if (seconds < 2) {
        return '';
      }
      if (seconds < 45) {
        return `${seconds}s`;
      }
      return `still working - ${seconds}s`;
    }

    // Assertions (not run automatically - paste into `node -e "<body>"`):
    // console.assert(formatElapsed(0) === '', '0s should be empty');
    // console.assert(formatElapsed(1) === '', '1s should be empty');
    // console.assert(formatElapsed(2) === '2s', '2s should show compact form');
    // console.assert(formatElapsed(14) === '14s', '14s should show compact form');
    // console.assert(formatElapsed(45) === 'still working - 45s', '45s should switch to reassurance form');
    // console.assert(formatElapsed(52) === 'still working - 52s', '52s should show reassurance form');

    function stopElapsedTimer() {
      if (elapsedTimer !== null) {
        window.clearInterval(elapsedTimer);
        elapsedTimer = null;
      }
    }

    recommendForm.addEventListener('htmx:beforeRequest', function () {
      var startedAt = Date.now();
      stopElapsedTimer();
      elapsedOutput.textContent = formatElapsed(0);
      elapsedTimer = window.setInterval(function () {
        elapsedOutput.textContent =
          formatElapsed(Math.floor((Date.now() - startedAt) / 1000));
      }, 1000);
    });

    // afterRequest fires on success, on a 4xx/5xx, and on a network drop
    // alike, so this is the one place the timer needs stopping.
    recommendForm.addEventListener('htmx:afterRequest', function () {
      stopElapsedTimer();
    });
  </script>
</body>
</html>
