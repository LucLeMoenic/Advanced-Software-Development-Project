# Student 5 - Travel Logistics & Advisory Service: frontend edge.
#
# This server does two jobs: it serves the static page, and it makes the
# backend look same-origin. The second job is the important one. HTMX swaps
# whatever HTML a URL returns, so if /ui/ were a cross-origin call the browser
# would need CORS on every fragment endpoint. Proxying instead keeps the
# backend free of CORS entirely and keeps the page's own URLs relative.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Combined with a variable in proxy_pass below, this
    # re-resolves student5-backend per request instead of caching the address
    # nginx saw at startup -- a bare hostname in proxy_pass is resolved once,
    # and goes stale the moment the backend container restarts on a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Compose healthcheck target. Plain text, no logging, no dependencies: it
    # reports that *this* container is serving, and deliberately says nothing
    # about the backend, so a backend outage does not also mark the frontend
    # unhealthy and restart it.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ---- Backend proxy ---------------------------------------------------
    #
    # proxy_pass with a variable and no URI part forwards the original request
    # URI unchanged, so /ui/weather?destination_id=12 arrives at the backend as
    # /ui/weather?destination_id=12. Writing `proxy_pass $backend/;` instead
    # would strip the location prefix and 404 every route.

    location /ui/ {
        set $student5_backend http://student5-backend:8080;
        proxy_pass $student5_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # POST /ui/advisory runs a local 3B model end to end. The default 60s
        # read timeout cuts that off mid-generation and hands the page a 504,
        # which HTMX will not swap -- the panel would just sit there. 180s is
        # sized for the slowest observed generation, not the average.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Fragments are per-destination and cheap to refetch; caching them
        # anywhere would mean showing one country's visa rule for another.
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        set $student5_backend_api http://student5-backend:8080;
        proxy_pass $student5_backend_api;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # Static page. Not an SPA, so an unknown path is a genuine 404 rather than
    # a rewrite to index.html.
    location / {
        try_files $uri $uri/ =404;
    }
}
